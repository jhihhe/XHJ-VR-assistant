<script>
    layui.use(['table','form','laydate','upload'], function() {
        var table = layui.table,laydate = layui.laydate,form = layui.form, $ = layui.jquery,upload = layui.upload;
        var tableIn = table.render({
            id: 'order',
            elem: '#order',
