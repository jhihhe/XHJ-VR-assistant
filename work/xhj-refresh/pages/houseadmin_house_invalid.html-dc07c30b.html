<html><head>
    <meta charset="utf-8">
    <title>象视平台后台管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="/static/plugins/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="/static/admin/css/global.css" media="all">
    <link rel="stylesheet" href="/static/common/css/font.css" media="all">
<link id="layuicss-layer" rel="stylesheet" href="https://vr.xhj.com/static/plugins/layui/css/modules/layer/default/layer.css?v=3.1.1" media="all"></head>
<body class="skin-0">

<div class="admin-main layui-anim layui-anim-upbit">
    <form class="layui-form layui-form-pane" lay-filter="form">
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-4">
                <input type="text" name="checkRemark" lay-verify="required" placeholder="可输入内容不超过50字" maxlength="50" class="layui-input">
            </div>
        </div>
        
        <div class="layui-form-item">
            <div class="layui-input-block">
                <input type="hidden" name="id">
                <input type="hidden" name="xiangShiToken">
                <input type="hidden" name="key">
                <input type="hidden" name="account">
                <a href="javascript:void(0)" class="layui-btn layui-btn-primary" id="cancelhouse">取消</a>
                <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">提交</button>
                
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="/static/plugins/layui/layui.js"></script>

<div style="display:none;"><script type="text/javascript" src="https://s11.cnzz.com/z_stat.php?id=1259448652&amp;web_id=1259448652"></script><script src="https://c.cnzz.com/c.js?web_id=1259448652&amp;t=z" charset="utf-8" type="text/javascript"></script><a href="https://www.cnzz.com/stat/website.php?web_id=1259448652" target="_blank" title="站长统计">站长统计</a></div>
<script>
    layui.use(['table','form', 'layer'], function () {
        var table = layui.table,form = layui.form, layer = layui.layer,$= layui.jquery;
        
         //取消
        $('#cancelhouse').on('click', function() {
            var index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
            parent.layer.close(index); // 再执行关闭
        });
        
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            var key = '';
            //console.log(data.field)
            //parent.location.href = "/houseadmin/house/index.html?keys="+key;
            $.get("https://api.xhj.com/api/xhj-bms/houseSurveyImg/xiangshi/invalid", data.field, function (res) {
                layer.close(loading);
                //console.log(res)
                if (res.code == 200) {
                    /*$.post("",{'house_nums':'HS260805501640'}, function (res) {
                        layer.msg(res.msg,{time:1000,icon:1}, function(){
                           parent.location.href = "/houseadmin/house/index.html?keys="+key;
                        });
                    });*/
                    layer.msg(res.msg, {time: 1800, icon: 1}, function () {
                        parent.location.href = "/houseadmin/house/index.html?keys="+key;
                    });
                }else {
                    layer.msg(res.msg, {time: 1800, icon: 2});
                }
            });
        });
        
    });
</script></body></html>
